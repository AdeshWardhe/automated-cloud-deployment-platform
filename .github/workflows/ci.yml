name: External FastAPI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v7

      - name: Checkout maintained FastAPI application
        uses: actions/checkout@v7
        with:
          repository: AdeshWardhe/python-samples-fastapi-restful
          ref: master
          path: app

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.3"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.5"

      - name: Install dependencies
        working-directory: app
        run: uv sync --group dev --frozen

      - name: Run automated tests
        working-directory: app
        run: uv run pytest

      - name: Run Semgrep security scan
        run: uvx semgrep scan --config p/default app

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Build Docker image
        run: docker build -t fastapi-app:ci ./app

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fastapi-app:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        run: |
          docker tag fastapi-app:ci ghcr.io/adeshwardhe/python-samples-fastapi-restful:latest
          docker push ghcr.io/adeshwardhe/python-samples-fastapi-restful:latest
